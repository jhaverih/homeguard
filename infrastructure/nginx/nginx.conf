events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    upstream api_backend {
        server api:3000;
    }

    upstream admin_backend {
        server admin:3002;
    }

    server {
        listen 80;
        server_name _;

        # AI maintenance bot — Ollama inference on low-end hardware takes 6+ minutes
        location /api/maintenance-bot/ {
            proxy_pass http://api_backend/api/maintenance-bot/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 720s;
        }

        # NestJS REST API
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # Socket.io WebSocket for native chat
        location /socket.io/ {
            proxy_pass http://api_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # Stripe webhook — needs raw body, bypass buffering
        location /api/payments/webhook {
            proxy_pass http://api_backend/api/payments/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
        }

        # Next.js Admin Dashboard
        location / {
            proxy_pass http://admin_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Narrow public gateway — reached only via the Cloudflare Tunnel bound to
    # api.attenteve.com (infrastructure/cloudflared/docker-compose.yml), NOT
    # via any router port-forward. Only the public service-area check/notify
    # routes are proxied here; everything else on this hostname 404s, so the
    # rest of the API (admin/vendor/payments/etc.) never becomes reachable
    # from the public internet through this path. The catch-all `server_name
    # _;` block above stays LAN/Tailscale-only, completely separate.
    server {
        listen 80;
        server_name api.attenteve.com;

        location /public/service-area/ {
            proxy_pass http://api_backend/api/public/service-area/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
