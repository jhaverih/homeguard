events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Docker's embedded DNS — used with variable-based proxy_pass below so
    # upstream hostnames are re-resolved lazily per-request instead of once
    # at nginx startup. Without this, nginx hard-refuses to start at all if
    # ANY upstream (including ones like `vendor` that aren't part of the
    # automated deploy pipeline and can be stopped independently) isn't
    # resolvable yet — which takes down every route, including LAN admin/API
    # access, not just the one route that depends on the missing service.
    # Hit this for real 2026-07-17: a stopped `vendor` container crash-looped
    # nginx entirely for ~2 minutes. With this, a stopped upstream now just
    # 502s on the routes that need it — everything else keeps working.
    #
    # IMPORTANT: proxy_pass here deliberately has NO trailing URI (just
    # `http://$var;`, not `http://$var/some/path;`). Also hit for real,
    # immediately after the fix above: nginx only does its normal "replace
    # matched location prefix with proxy_pass's URI" rewriting when the
    # proxy_pass target is static. Once the host is a variable, adding any
    # literal path after it makes nginx send that literal path VERBATIM for
    # every request, discarding everything else in the original URI (so
    # `/api/health` was being forwarded to the backend as just `/api/`,
    # and every admin request was forwarded as just `/`, masked in a
    # browser by client-side routing but breaking every direct/API call).
    # No trailing URI at all means nginx passes the original request URI
    # through completely unchanged, which is what every backend here
    # expects anyway since each location's prefix already matches the
    # backend's own routing exactly.
    resolver 127.0.0.11 valid=10s;

    # Basic abuse/brute-force protection for the public hostnames below —
    # authenticated endpoints (e.g. /api/auth/login) become internet-
    # reachable for the first time once these are live, so this is a cheap
    # first line of defense in front of the app's own auth guards, not a
    # replacement for them. Not applied to the LAN-only `_` server block.
    limit_req_zone $binary_remote_addr zone=public_gateway:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        # AI maintenance bot — Ollama inference on low-end hardware takes 6+ minutes
        location /api/maintenance-bot/ {
            set $upstream_api api:3000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 720s;
        }

        # NestJS REST API
        location /api/ {
            set $upstream_api api:3000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # Socket.io WebSocket for native chat
        location /socket.io/ {
            set $upstream_api api:3000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # Stripe webhook — needs raw body, bypass buffering
        location /api/payments/webhook {
            set $upstream_api api:3000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
        }

        # Next.js Admin Dashboard
        location / {
            set $upstream_admin admin:3002;
            proxy_pass http://$upstream_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Public API gateway — reached only via the Cloudflare Tunnel bound to
    # api.attenteve.com (infrastructure/cloudflared/docker-compose.yml), NOT
    # via any router port-forward. Widened 2026-07-17 from a single narrow
    # service-area-only route to the full API, for the pilot launch: the
    # mobile app (customers + vendors) needs this reachable from outside the
    # LAN. Every route here still requires the same JWT/role auth the API
    # already enforces for LAN access — nothing about this path is less
    # guarded. Admin is deliberately NEVER proxied under this or the vendor
    # hostname below — it only ever exists on the catch-all `server_name _;`
    # block above (LAN/Tailscale only), so it's structurally unreachable
    # from the public internet regardless of any guard configuration.
    server {
        listen 80;
        server_name api.attenteve.com;
        limit_req zone=public_gateway burst=20 nodelay;

        location /api/maintenance-bot/ {
            set $upstream_api api:3000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 720s;
        }

        location /api/ {
            set $upstream_api api:3000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        location /socket.io/ {
            set $upstream_api api:3000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        location /api/payments/webhook {
            set $upstream_api api:3000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
        }

        location / {
            return 404;
        }
    }

    # Public Vendor portal — same Tunnel, separate hostname. Vendors log in
    # from anywhere during the pilot; still guarded by the app's own auth.
    server {
        listen 80;
        server_name vendor.attenteve.com;
        limit_req zone=public_gateway burst=20 nodelay;

        location / {
            set $upstream_vendor vendor:3003;
            proxy_pass http://$upstream_vendor;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
