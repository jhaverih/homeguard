events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Basic abuse/brute-force protection for the public hostnames below —
    # authenticated endpoints (e.g. /api/auth/login) become internet-
    # reachable for the first time once these are live, so this is a cheap
    # first line of defense in front of the app's own auth guards, not a
    # replacement for them. Not applied to the LAN-only `_` server block.
    limit_req_zone $binary_remote_addr zone=public_gateway:10m rate=10r/s;

    upstream api_backend {
        server api:3000;
    }

    upstream admin_backend {
        server admin:3002;
    }

    upstream vendor_backend {
        server vendor:3003;
    }

    server {
        listen 80;
        server_name _;

        # AI maintenance bot — Ollama inference on low-end hardware takes 6+ minutes
        location /api/maintenance-bot/ {
            proxy_pass http://api_backend/api/maintenance-bot/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 720s;
        }

        # NestJS REST API
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # Socket.io WebSocket for native chat
        location /socket.io/ {
            proxy_pass http://api_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # Stripe webhook — needs raw body, bypass buffering
        location /api/payments/webhook {
            proxy_pass http://api_backend/api/payments/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
        }

        # Next.js Admin Dashboard
        location / {
            proxy_pass http://admin_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Public API gateway — reached only via the Cloudflare Tunnel bound to
    # api.attenteve.com (infrastructure/cloudflared/docker-compose.yml), NOT
    # via any router port-forward. Widened 2026-07-17 from a single narrow
    # service-area-only route to the full API, for the pilot launch: the
    # mobile app (customers + vendors) needs this reachable from outside the
    # LAN. Every route here still requires the same JWT/role auth the API
    # already enforces for LAN access — nothing about this path is less
    # guarded. Admin is deliberately NEVER proxied under this or the vendor
    # hostname below — it only ever exists on the catch-all `server_name _;`
    # block above (LAN/Tailscale only), so it's structurally unreachable
    # from the public internet regardless of any guard configuration.
    server {
        listen 80;
        server_name api.attenteve.com;
        limit_req zone=public_gateway burst=20 nodelay;

        location /api/maintenance-bot/ {
            proxy_pass http://api_backend/api/maintenance-bot/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 720s;
        }

        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        location /socket.io/ {
            proxy_pass http://api_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        location /api/payments/webhook {
            proxy_pass http://api_backend/api/payments/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
        }

        location / {
            return 404;
        }
    }

    # Public Vendor portal — same Tunnel, separate hostname. Vendors log in
    # from anywhere during the pilot; still guarded by the app's own auth.
    server {
        listen 80;
        server_name vendor.attenteve.com;
        limit_req zone=public_gateway burst=20 nodelay;

        location / {
            proxy_pass http://vendor_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
