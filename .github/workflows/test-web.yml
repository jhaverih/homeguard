name: Test Web (api, admin, vendor)

on:
  push:
    branches: [staging]
    # package-lock.json is deliberately NOT listed here: it's one shared
    # lockfile for the whole npm-workspaces monorepo, so installing a
    # dependency in apps/mobile alone still rewrites it — including it would
    # make every workspace's test workflow fire on every other workspace's
    # dependency change, defeating the point of path filtering. Root
    # package.json (the workspaces/scripts list itself) changes far less
    # often and is a real cross-cutting change worth testing everywhere.
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/vendor/**'
      - 'packages/shared/**'
      - 'package.json'
      - '.github/workflows/test-web.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/vendor/**'
      - 'packages/shared/**'
      - 'package.json'
      - '.github/workflows/test-web.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=apps/api

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=apps/admin

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=apps/vendor
