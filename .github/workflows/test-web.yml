name: Test Web (api, admin, vendor)

on:
  # PR-only: this file used to also run on push to staging, but that made
  # tests run in a workflow completely disconnected from the deploy workflow
  # — a failing test never stopped a deploy, it just ran in parallel and
  # showed a red X *next to* a deploy that shipped anyway. staging.yml now
  # has its own copies of these same three jobs, and its deploy job formally
  # depends on them (`needs:`) — so on every push to staging, tests really do
  # gate the deploy. This file's only remaining purpose is PR feedback, since
  # a PR never deploys anything and so has nothing to gate.
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/vendor/**'
      - 'packages/shared/**'
      - 'package.json'
      - '.github/workflows/test-web.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=apps/api

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=apps/admin

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=apps/vendor
