name: Build Mobile App (EAS)

on:
  # Manual only, deliberately — do not add a push trigger. EAS free-tier
  # build credits reset monthly and are a scarce, rationed resource (this
  # project currently only builds iOS through EAS; Android is built locally,
  # see docs/mobile-build.md). Auto-triggering on every push would burn
  # through a month's iOS credits on routine commits and leave none
  # available when a real TestFlight build is actually needed — which is
  # exactly the situation that prompted this note. Trigger a build here
  # (Actions tab -> Run workflow) only when you actually want to spend one.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'ios'
        type: choice
        options: [all, android, ios]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      # The repo's real Expo access token is stored as QNAP_EXPO_TOKEN (the
      # QNAP_ prefix is just this repo's convention for secrets also pushed
      # to the QNAP's .env by update-env.yml — it's a real Expo token, not
      # QNAP-specific). This workflow referenced a plain EXPO_TOKEN secret
      # that never existed for two months, so every run failed instantly
      # with "An Expo user account is required to proceed" before it ever
      # reached EAS. If this ever breaks again, check secret naming first.
      - name: Build Android APK
        if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' }}
        working-directory: apps/mobile
        run: eas build --platform android --non-interactive --profile preview
        env:
          EXPO_TOKEN: ${{ secrets.QNAP_EXPO_TOKEN }}

      - name: Build iOS IPA
        if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' }}
        working-directory: apps/mobile
        run: eas build --platform ios --non-interactive --profile preview
        env:
          EXPO_TOKEN: ${{ secrets.QNAP_EXPO_TOKEN }}
