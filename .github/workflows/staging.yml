name: Deploy to QNAP Staging

on:
  push:
    branches: [staging]
    # Only redeploy when something that actually affects the deployed
    # services changed — this workflow rebuilds and restarts api/admin/
    # vendor/nginx on QNAP, which takes 20-30+ minutes, so a docs/gitignore-
    # only commit shouldn't trigger it. apps/mobile is deliberately excluded:
    # it isn't part of this deploy at all (built/distributed separately via
    # Expo/EAS).
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/vendor/**'
      - 'packages/shared/**'
      - 'infrastructure/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/staging.yml'
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, qnap]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backup database before deploy
        run: |
          # Always snapshot the DB before touching any containers — even if postgres is down
          # this succeeds silently so it never blocks a deploy.
          /share/Container/homeguard/backup.sh && \
            echo "Pre-deploy backup complete" || \
            echo "Pre-deploy backup skipped (postgres may not be running yet)"

      - name: Deploy with Docker Compose
        run: |
          cp /share/Container/homeguard/.env infrastructure/.env 2>/dev/null || true
          # Export all vars so docker-compose variable substitution works (postgres, redis, minio passwords)
          set -a; source /share/Container/homeguard/.env 2>/dev/null || true; set +a

          # Build admin AND vendor first with --no-cache, SEQUENTIALLY (not in one combined
          # invocation) — do it before stopping services to minimise downtime. Both are Next.js
          # standalone builds; a stale cached layer can silently drop .next/standalone/server.js
          # from the final image, which typechecks/builds fine but crash-loops the container at
          # runtime with MODULE_NOT_FOUND. Learned this the hard way with admin first
          # (2026-07-15), then vendor hit the exact same symptom 2026-07-19 — that time the
          # actual cause was `npm run build` itself failing (a flaky Next.js standalone-tracing
          # ENOENT, likely from admin+vendor's builds contending for CPU/memory on the same
          # invocation) combined with a broken shell guard in the Dockerfile that let the
          # broken image ship anyway (now fixed — see apps/vendor/Dockerfile). Building them one
          # at a time reduces the odds of hitting that resource-contention flake again; the
          # Dockerfile guard fix means a genuine build failure now stops this workflow instead
          # of silently deploying a broken image either way.
          docker compose -f infrastructure/docker-compose.staging.yml build --no-cache admin
          docker compose -f infrastructure/docker-compose.staging.yml build --no-cache vendor
          docker compose -f infrastructure/docker-compose.staging.yml build api nginx

          # Stop containers (not down — down removes the network which causes QNAP dnsmasq NAT errors)
          docker compose -f infrastructure/docker-compose.staging.yml stop || true
          docker compose -f infrastructure/docker-compose.staging.yml pull --ignore-pull-failures || true

          # Start data services WITHOUT --force-recreate so the postgres data volume is never
          # blown away. Only bring them up if stopped; don't touch running ones.
          docker compose -f infrastructure/docker-compose.staging.yml up -d postgres redis minio
          until docker compose -f infrastructure/docker-compose.staging.yml exec -T postgres pg_isready -U homeguard -q; do sleep 2; done

          # Align postgres password with .env — use SIGHUP to reload config (no psql auth needed for reload)
          DB_PASSWORD=$(grep '^DB_PASSWORD=' infrastructure/.env 2>/dev/null | cut -d= -f2 || echo 'changeme')
          docker compose -f infrastructure/docker-compose.staging.yml exec -T postgres sh -c \
            "sed -i 's/scram-sha-256/trust/g' /var/lib/postgresql/data/pg_hba.conf \
             && kill -HUP \$(head -1 /var/lib/postgresql/data/postmaster.pid)" || true
          sleep 1
          docker compose -f infrastructure/docker-compose.staging.yml exec -T postgres \
            psql -U homeguard -c "ALTER USER homeguard WITH PASSWORD '${DB_PASSWORD}';" || true
          docker compose -f infrastructure/docker-compose.staging.yml exec -T postgres sh -c \
            "sed -i 's/trust/scram-sha-256/g' /var/lib/postgresql/data/pg_hba.conf \
             && kill -HUP \$(head -1 /var/lib/postgresql/data/postmaster.pid)" || true

          # Force-recreate only app containers (api, admin, nginx, vendor) — never data containers.
          # postgres/redis/minio stay running with their volumes untouched.
          # vendor added 2026-07-17: it was previously excluded from this list, which meant
          # every deploy's `stop` step above stopped it without ever bringing it back, and
          # its absence could crash-loop nginx entirely (see nginx.conf's resolver comment).
          docker compose -f infrastructure/docker-compose.staging.yml up --force-recreate --remove-orphans -d \
            api admin nginx vendor
          docker compose -f infrastructure/docker-compose.staging.yml ps

      - name: Wait for API health check
        run: |
          echo "Waiting for API health check..."
          for i in $(seq 1 48); do
            STATUS=$(docker compose -f infrastructure/docker-compose.staging.yml exec -T api node -e "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" 2>/dev/null && echo "ok" || echo "fail")
            if [ "$STATUS" = "ok" ]; then
              echo "API is healthy!"
              break
            fi
            echo "Attempt $i/48 — waiting 10s..."
            sleep 10
          done

      - name: Show running services
        run: docker compose -f infrastructure/docker-compose.staging.yml ps

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== API logs ==="
          docker compose -f infrastructure/docker-compose.staging.yml logs api --tail=60
          echo "=== Admin logs ==="
          docker compose -f infrastructure/docker-compose.staging.yml logs admin --tail=60
          echo "=== Nginx logs ==="
          docker compose -f infrastructure/docker-compose.staging.yml logs nginx --tail=20
          echo "=== Vendor logs ==="
          docker compose -f infrastructure/docker-compose.staging.yml logs vendor --tail=40

      - name: Clean up old images
        run: docker image prune -f
