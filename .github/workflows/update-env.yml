name: Update QNAP .env

on:
  workflow_dispatch:

jobs:
  update-env:
    runs-on: [self-hosted, qnap]
    steps:
      - name: Write .env to QNAP
        env:
          DB_PASSWORD:    ${{ secrets.QNAP_DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.QNAP_REDIS_PASSWORD }}
          JWT_SECRET:     ${{ secrets.QNAP_JWT_SECRET }}
          MINIO_PASSWORD: ${{ secrets.QNAP_MINIO_PASSWORD }}
          STRIPE_SECRET:  ${{ secrets.QNAP_STRIPE_SECRET }}
          STRIPE_PK:      ${{ secrets.QNAP_STRIPE_PK }}
          EXPO_TOKEN:     ${{ secrets.QNAP_EXPO_TOKEN }}
        run: |
          mkdir -p /share/Container/homeguard
          F=/share/Container/homeguard/.env
          {
            echo "DB_HOST=postgres"
            echo "DB_PORT=5432"
            echo "DB_NAME=homeguard"
            echo "DB_USER=homeguard"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "REDIS_HOST=redis"
            echo "REDIS_PORT=6379"
            echo "REDIS_PASSWORD=${REDIS_PASSWORD}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_EXPIRES_IN=7d"
            echo "MINIO_ENDPOINT=minio"
            echo "MINIO_PORT=9000"
            echo "MINIO_USE_SSL=false"
            echo "MINIO_ROOT_USER=minioadmin"
            echo "MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}"
            echo "MINIO_BUCKET_NAME=homeguard"
            echo "STRIPE_SECRET_KEY=${STRIPE_SECRET}"
            echo "STRIPE_PUBLISHABLE_KEY=${STRIPE_PK}"
            echo "STRIPE_WEBHOOK_SECRET=TODO_setup_webhook_at_stripe_dashboard"
            echo "PLATFORM_FEE_PERCENT=15"
            echo "EXPO_ACCESS_TOKEN=${EXPO_TOKEN}"
            echo "NODE_ENV=staging"
            echo "API_PORT=3000"
            echo "ADMIN_PORT=3002"
            echo "API_URL=http://192.168.86.29/api"
            echo "ALLOWED_ORIGINS=http://192.168.86.29"
          } > "$F"
          echo ".env written successfully"

      - name: Restart API container
        run: docker restart infrastructure-api-1 && echo "API restarted"
